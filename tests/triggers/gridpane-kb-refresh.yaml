# Trigger evaluation for gridpane-kb-refresh.
# Prompts that should select this skill, and prompts that should not
# (they belong to a sibling skill). See AGENTS.md and the plan's testing phase.

should_trigger:
  - "scrape the gridpane knowledge base and update the skills"
  - "refresh the KB index"
  - "the gridpane docs moved, what skills need updating"
  - "which skills cite this KB article"
  - "how do I check whether the knowledge base changed since our last snapshot"
  - "rebuild the docs manifest and tell me which references to fix"
  - "is our kb snapshot stale"

should_not_trigger:
  - "what gp command clears the fastcgi cache for a site"
  - "example.com on gridpane is returning 502 right now"
  - "add a custom nginx rule to block xmlrpc on example.com"
  - "where should I put a custom tool so gridpane updates don't remove it"
  - "postgres is using all the memory on our database server"
